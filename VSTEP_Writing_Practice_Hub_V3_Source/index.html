<!DOCTYPE html>

<title>IELTS Writing Task 2 | Practice Hub</title>
<style>
:root{--navy:#173b5e;--blue:#24618b;--cyan:#eaf4fa;--ink:#203247;--muted:#718096;--line:#dce5ed;--bg:#f4f7fb;--green:#16845b;--red:#c04444;--gold:#e5a12b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
header{background:linear-gradient(120deg,#143653,#24618b);color:#fff;padding:26px max(22px,calc((100% - 1180px)/2))}
header .eyebrow{font-size:12px;letter-spacing:2px;opacity:.8;font-weight:700}header h1{margin:8px 0;font-size:clamp(23px,4vw,34px)}header p{margin:0;color:#dceaf4}
.shell{max-width:1180px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:260px 1fr;gap:20px}
nav,.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px #173b5e0a}
nav{padding:14px;height:max-content;position:sticky;top:15px}nav .navtitle{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1.2px;padding:10px}
.navbtn{border:0;background:transparent;width:100%;text-align:left;padding:12px;border-radius:10px;color:#42566b;cursor:pointer;font-weight:650;margin:2px 0}
.navbtn.active,.navbtn:hover{background:var(--cyan);color:var(--navy)}.navbtn small{display:block;color:#8796a5;font-weight:400;margin-top:4px}
main{min-width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat{padding:15px 17px}.stat b{font-size:24px;color:var(--navy);display:block}.stat span{font-size:12px;color:var(--muted)}
.panel{padding:24px}.panel h2{margin:0 0 7px;color:var(--navy);font-size:23px}.sub{color:var(--muted);margin:0 0 20px;line-height:1.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{width:100%;border:1px solid #cbd8e3;border-radius:10px;padding:13px 14px;font:inherit;outline:none;background:#fff}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px #24618b18}
select.field{width:auto;min-width:210px}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.12)}.btn.light{background:var(--cyan);color:var(--navy)}.btn.outline{background:white;border:1px solid var(--line);color:var(--ink)}
.question{background:#f7fafc;border:1px solid var(--line);border-radius:14px;padding:22px;margin:18px 0}.qtag{font-size:11px;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:1px}.prompt{font-size:22px;font-weight:750;margin:12px 0 8px;line-height:1.4}.hint{font-size:13px;color:var(--muted)}
.feedback{padding:13px 15px;border-radius:10px;margin-top:14px;line-height:1.55}.good{background:#e8f7f0;color:#116444}.bad{background:#fff0f0;color:#a83232}.neutral{background:#fff8e8;color:#8b5b0c}
.progress{height:7px;background:#e8eef3;border-radius:20px;overflow:hidden;margin:13px 0}.progress span{height:100%;display:block;background:#3a8baf;width:0}
.topicgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.topic{border:1px solid var(--line);border-radius:12px;padding:13px;text-align:left;background:white;cursor:pointer}.topic.active{border-color:var(--blue);background:var(--cyan)}.topic b{display:block;color:var(--navy)}.topic small{color:var(--muted)}
.table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}.table th{background:var(--navy);color:white;text-align:left}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);vertical-align:top}.table tr:nth-child(even){background:#f8fafc}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:var(--muted);font-size:13px}.divider{border:0;border-top:1px solid var(--line);margin:20px 0}
@media(max-width:800px){.shell{grid-template-columns:1fr}nav{position:static;display:grid;grid-template-columns:1fr 1fr}.navtitle{grid-column:1/-1}.stats{grid-template-columns:repeat(3,1fr)}.panel{padding:18px}}
@media(max-width:520px){nav{grid-template-columns:1fr}.topicgrid,.inline{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:11px}.stat b{font-size:19px}}
</style>
<style id="mobile-optimizations">

body { min-height: 100vh; min-height: 100dvh; }
button, input, textarea, select { font: inherit; }

  }

  }
  .navbtn small { display:none; }
  .stats { gap:8px; margin-bottom:12px; }
  .stat { min-width:0; padding:12px 10px; border-radius:12px; }
  .stat b { font-size:21px; }
  .stat span { font-size:11px; line-height:1.25; display:block; }
  .panel { padding:17px 14px; border-radius:14px; }
  .panel h2 { font-size:21px; line-height:1.25; }
  .sub { font-size:14px; margin-bottom:15px; }
  .question { padding:17px 14px; margin:14px 0; }
  .prompt { font-size:20px; overflow-wrap:anywhere; }
  .row { gap:8px; }
  .row .btn { flex:1 1 auto; min-height:44px; }
  .field { min-height:46px; padding:12px; }
  select.field { width:100%; min-width:0; }
  .topicgrid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .topic { min-height:70px; padding:11px 9px; }
  .topic b { font-size:13px; line-height:1.3; }
  .topic small { font-size:11px; }

}
@media (max-width: 420px) {
  header { padding-left:16px; padding-right:16px; }
  header h1 { font-size:23px; }
  header p { font-size:13px; line-height:1.45; }
  .shell { padding-left:9px; padding-right:9px; }
  .stats { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .stat b { font-size:19px; }
  .topicgrid { grid-template-columns:1fr 1fr; }
  .prompt { font-size:18px; }
  .row .btn { font-size:13px; padding:11px 10px; }
}
</style>


<style id="outline-style">
.outline-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.outline-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;background:#fbfdff}
.idea-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.idea-chip{background:#eef5fa;border:1px solid #d8e7f1;color:#254b68;border-radius:9px;padding:9px 10px;text-align:left;cursor:pointer;font-size:13px;line-height:1.45}
.idea-chip:hover{background:#dcecf6}
.outline-label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;color:#38536b}
.outline-preview{white-space:pre-wrap;background:#f7fafc;border:1px dashed #bdccd8;border-radius:10px;padding:14px;font-size:13px;line-height:1.65;overflow-wrap:anywhere}
.saved-list{display:flex;flex-wrap:wrap;gap:7px}
.saved-pill{border:1px solid var(--line);background:white;border-radius:20px;padding:7px 10px;font-size:12px}
@media(max-width:800px){.idea-list{grid-template-columns:1fr}.outline-card{padding:12px}}
</style>

ết kiệm tài nguyên thiên nhiên"}, {"en": "Promote public transportation", "vi": "Khuyến khích giao thông công cộng"}, {"en": "Raise environmental awareness", "vi": "Nâng cao nhận thức môi trường"}, {"en": "Encourage recycling activities", "vi": "Khuyến khích tái chế"}, {"en": "Protect wildlife", "vi": "Bảo vệ động vật hoang dã"}, {"en": "Address environmental problems", "vi": "Giải quyết vấn đề môi trường"}, {"en": "Improve living conditions", "vi": "Cải thiện điều kiện sống"}]}, {"name": "Society and Community – Xã hội và cộng đồng", "items": [{"en": "Strengthen community bonds", "vi": "Thắt chặt liên kết cộng đồng"}, {"en": "Help people in need", "vi": "Giúp đỡ người gặp khó khăn"}, {"en": "Improve living standards", "vi": "Cải thiện mức sống"}, {"en": "Develop social responsibility", "vi": "Phát triển trách nhiệm xã hội"}, {"en": "Build self-confidence", "vi": "Xây dựng sự tự tin"}, {"en": "Expand social networks", "vi": "Mở rộng quan hệ xã hội"}, {"en": "Improve communication skills", "vi": "Cải thiện kỹ năng giao tiếp"}, {"en": "Understand different cultures", "vi": "Hiểu các nền văn hóa khác nhau"}, {"en": "Address social problems", "vi": "Giải quyết vấn đề xã hội"}, {"en": "Create a better society", "vi": "Xây dựng xã hội tốt đẹp hơn"}, {"en": "Promote social equality", "vi": "Thúc đẩy bình đẳng xã hội"}]}, {"name": "Relationships and Family – Các mối quan hệ và gia đình", "items": [{"en": "Build strong relationships", "vi": "Xây dựng mối quan hệ bền chặt"}, {"en": "Develop mutual trust", "vi": "Phát triển sự tin tưởng lẫn nhau"}, {"en": "Provide emotional support", "vi": "Cung cấp hỗ trợ tinh thần"}, {"en": "Share personal experiences", "vi": "Chia sẻ trải nghiệm cá nhân"}, {"en": "Maintain long-term friendships", "vi": "Duy trì tình bạn lâu dài"}, {"en": "Spend quality time together", "vi": "Dành thời gian chất lượng bên nhau"}, {"en": "Strengthen family bonds", "vi": "Thắt chặt tình cảm gia đình"}, {"en": "Reduce feelings of loneliness", "vi": "Giảm cảm gi let page='topics',topicIndex=0,mode='envi',pool=[],idx=0,checked=0,correct=0,answered=false,showHint=false;
const $=s=>document.querySelector(s);
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!?;:()[\]]/g,' ').replace(/\s+/g,' ').trim();
function stats(){$('#total').textContent=checked;$('#correct').textContent=correct;$('#rate').textContent=(checked?Math.round(correct/checked*100):0)+'%'}
function nav(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function startPool(items){pool=[...items].sort(()=>Math.random()-.5);idx=0;answered=false;showHint=false}
function next(){idx=(idx+1)%pool.length;answered=false;showHint=false;render()}
function answerCheck(expected,typed,accept=[]){let n=norm(typed);return [expected,...accept].some(x=>norm(x)===n)}
function feedback(ok,html){return `<div class="feedback ${ok?'good':'bad'}">${ok?'✓ Chính xác!':'✕ Chưa chính xác.'} ${html||''}</div>`}
function topicPage(){
 const t=DATA.topics[topicIndex];
 return `<h2>Phần 1 · 8 chủ đề ý tưởng</h2><p class="sub">Luyện ghi nhớ các cụm từ theo 8 nhóm chủ đề trong tài liệu.</p>
 <div class="topicgrid">${DATA.topics.map((x,i)=>`<button class="topic ${i===topicIndex?'active':''}" onclick="topicIndex=${i};buildTopic()"><b>${i+1}. ${x.name.split(' – ')[0]}</b><small>${x.items.length} cụm từ</small></button>`).join('')}</div>
 <div class="row"><select class="field" id="topicMode" onchange="mode=this.value;startPool(DATA.topics[topicIndex].items);render()"><option value="envi" ${mode==='envi'?'selected':''}>Tiếng Anh → điền nghĩa Việt</option><option value="vien" ${mode==='vien'?'selected':''}>Tiếng Việt → điền cụm từ Anh</option></select><button class="btn light" onclick="startPool(DATA.topics[topicIndex].items);render()">Trộn câu hỏi</button></div>
 <div id="quiz"></div>`;
}
function buildTopic(){startPool(DATA.topics[topicIndex].items);render()}
function quizTopic(){
 if(!pool.length)startPool(DATA.topics[topicIndex].items);
 const item=pool[idx],prompt=mode==='envi'?item.en:item.vi,expected=mode==='envi'?item.vi:item.en;
 return `<div class="progress"><span style="width:${(idx+1)/pool.length*100}%"></span></div><div class="question"><div class="qtag">Câu ${idx+1}/${pool.length} · ${mode==='envi'?'Dịch sang tiếng Việt':'Dịch sang tiếng Anh'}</div><div class="prompt">${prompt}</div><div class="hint">Nhập câu trả lời của bạn vào ô bên dưới.</div></div>
 <input id="ans" class="field" placeholder="${mode==='envi'?'Nhập nghĩa tiếng Việt...':'Enter the English phrase...'}" onkeydown="if(event.key==='Enter')checkTopic()">
 <div class="row" style="margin-top:12px"><button class="btn" onclick="checkTopic()">Kiểm tra đáp án</button><button class="btn light" onclick="showTopicHint()">Gợi ý</button><button class="btn outline" onclick="next()">Bỏ qua →</button></div><div id="result"></div>`;
}
function showTopicHint(){let x=pool[idx];$('#result').innerHTML=`<div class="feedback neutral">Gợi ý: ${mode==='envi'?x.vi.split(' ').slice(0,2).join(' ')+'…':x.en.split(' ').slice(0,2).join(' ')+'…'}</div>`}
function checkTopic(){if(answered)return;let x=pool[idx],exp=mode==='envi'?x.vi:x.en,typed=$('#ans').value;if(!typed.trim())return;let ok=answerCheck(exp,typed);checked++;if(ok)correct++;answered=true;stats();$('#result').innerHTML=feedback(ok,`Đáp án: <b>${exp}</b>`);$('#ans').disabled=true;$('#result').innerHTML+=`<button class="btn light" style="margin-top:10px" onclick="next()">Câu tiếp theo →</button>`}
function grammarPage(){return `<h2>Phần 2 · Các cấu trúc ngữ pháp thường gặp</h2><p class="sub">Ôn tập 16 nhóm cấu trúc. Bạn có thể luyện nhận diện ý nghĩa hoặc tự viết cấu trúc và câu ví dụ.</p>
 <div class="row"><select class="field" id="gmode" onchange="mode=this.value;startGrammar();render()"><option value="formMeaning" ${mode==='formMeaning'?'selected':''}>Phần 1 · Cho cấu trúc → điền ý nghĩa</option><option value="meaningForm" ${mode==='meaningForm'?'selected':''}>Phần 2 · Cho ý nghĩa → điền cấu trúc + ví dụ</option></select><select class="field" id="gcat" onchange="grammarCat=+this.value;startGrammar();render()"><option value="-1">Tất cả nhóm cấu trúc</option>${DATA.grammar.map((g,i)=>`<option value="${i}">${i+1}. ${g.name}</option>`).join('')}</select></div><div id="quiz"></div>`}
let grammarCat=-1;
function startGrammar(){let a=grammarCat<0?DATA.grammar.flatMap((g,gi)=>g.items.map(x=>({...x,group:g.name}))):DATA.grammar[grammarCat].items.map(x=>({...x,group:DATA.grammar[grammarCat].name}));startPool(a)}
function grammarQuiz(){if(!pool.length)startGrammar();let x=pool[idx],q=mode==='formMeaning'?x.form:x.meaning;return `<div class="progress"><span style="width:${(idx+1)/pool.length*100}%"></span></div><div class="question"><div class="qtag">Câu ${idx+1}/${pool.length} · ${x.group}</div><div class="prompt">${q}</div>${mode==='meaningForm'?'<div class="hint">Viết cấu trúc tiếng Anh, sau đó tự đặt một câu ví dụ.</div>':''}</div>
 <label class="muted">Đáp án</label><input id="gans" class="field" placeholder="${mode==='formMeaning'?'Nhập ý nghĩa tiếng Việt...':'Nhập cấu trúc tiếng Anh...'}">
 ${mode==='meaningForm'?'<label class="muted" style="display:block;margin:14px 0 6px">Câu ví dụ của bạn</label><textarea id="example" class="field" rows="3" placeholder="Write your own example sentence..."></textarea>':''}
 <div class="row" style="margin-top:12px"><button class="btn" onclick="checkGrammar()">Kiểm tra</button><button class="btn outline" onclick="next()">Bỏ qua →</button></div><div id="result"></div>`}
function checkGrammar(){if(answered)return;let x=pool[idx],typed=$('#gans').value;if(!typed.trim())return;let ok=mode==='formMeaning'?answerCheck(x.meaning,typed):norm(typed)===norm(x.form);let ex=mode==='meaningForm'?$('#example').value.trim():'';if(mode==='meaningForm'&&!ex)return $('#result').innerHTML='<div class="feedback neutral">Bạn hãy nhập thêm một câu ví dụ để hoàn thành câu hỏi.</div>';checked++;if(ok)correct++;answered=true;stats();let html=feedback(ok,`Đáp án: <b>${mode==='formMeaning'?x.meaning:x.form}</b>`);if(mode==='meaningForm'){html+=`<div class="feedback neutral"><b>Ví dụ tham khảo:</b> ${x.example}<br><br><b>Kiểm tra câu của bạn:</b> ${reviewSentence(ex)}</div>`}$('#result').innerHTML=html+`<button class="btn light" style="margin-top:10px" onclick="next()">Câu tiếp theo →</button>`}
function reviewSentence(s){let fixes=[[/\bpeople\s+wants\b/gi,'People want'],[/\bhelp\s+(\w+)\s+to\s+improving\b/gi,'help $1 to improve'],[/\bmake\s+(\w+)\s+to\s+(\w+)/gi,'make $1 $2'],[/\blead\s+to\s+improve\b/gi,'lead to improvements / lead to improving'],[/\bspend\s+time\s+to\s+(\w+)/gi,'spend time $1ing'],[/\bdiscuss\s+about\b/gi,'discuss'],[/\bwant\s+(?!to\b)(\w+)/gi,'want to $1'],[/\bsuitable\s+to\b/gi,'suitable for']];let out=s,notes=[];for(let [re,rep] of fixes){if(re.test(out)){out=out.replace(re,rep);notes.push(`Có thể sửa thành: <b>${out}</b>`);break}}return notes.length?`<span style="color:#a83232">${notes[0]}</span><br><span class="muted">Gợi ý tự động dựa trên các lỗi phổ biến trong tài liệu; hãy kiểm tra lại ngữ cảnh câu.</span>`:`<span style="color:#16845b">Không phát hiện lỗi thuộc danh sách lỗi phổ biến. Hãy đối chiếu với cấu trúc mục tiêu: <b>${pool[idx].form}</b>.</span><br><span class="muted">Đây là bộ kiểm tra quy tắc cơ bản, không thay thế đánh giá ngữ pháp đầy đủ.</span>`}
function linkerPage(){return `<h2>Phần 3 · Từ nối và cách diễn đạt</h2><p class="sub">Luyện 7 nhóm từ nối và 15 cách nâng cấp diễn đạt có trong tài liệu.</p><div class="row"><select class="field" id="lmode" onchange="mode=this.value;startLinkers();render()"><option value="phraseMeaning" ${mode==='phraseMeaning'?'selected':''}>Phần 1 · Cụm từ → điền nghĩa</option><option value="meaningPhrase" ${mode==='meaningPhrase'?'selected':''}>Phần 2 · Nghĩa → điền cụm từ</option></select><select class="field" id="ltype" onchange="linkType=this.value;startLinkers();render()"><option value="linkers">Từ nối</option><option value="upgrades">15 cách diễn đạt nâng cấp</option></select></div><div id="quiz"></div>`}
let linkType='linkers';
function startLinkers(){let a=linkType==='linkers'?DATA.linkers.map(x=>({...x,answer:x.phrase,prompt:x.meaning,group:x.group})):DATA.upgrades.map(x=>({...x,answer:x.better,prompt:x.basic,group:'Cách diễn đạt nâng cấp'}));if(mode==='phraseMeaning')a=a.map(x=>({...x,answer:x.meaning||x.better,prompt:x.phrase||x.basic}));else a=a.map(x=>({...x,answer:x.phrase||x.better,prompt:x.meaning||x.basic}));startPool(a)}

 will turn red soon, they can slow down safely."]}, {"title": "Đoạn 2: Giải thích vì sao không đồng ý (Disagree)", "ideas": ["Increase the risk of accidents — Tăng nguy cơ tai nạn", "Drive too fast — Lái xe quá nhanh", "Ignore traffic rules — Phớt lờ luật giao thông", "Cause traffic congestion — Gây tắc nghẽn giao thông"], "chains": ["Some people think that traffic light counters help people who are not careful to speed up to cross the street before the red light.", "Traffic light counters can give false information and may encourage drivers to drive dangerously."]}]}, {"id": "electromagnetic-radiation", "label": "Đề bổ sung 07 · Causes and harmful effects of electromagnetic radiation", "type": "Causes & Effects", "question": "Discuss the causes and harmful effects of electromagnetic radiation.", "intro": "Bài luận thảo luận nguyên nhân và những tác động có hại của bức xạ điện từ.", "groups": [{"title": "Đoạn 1: Nguyên nhân (Causes)", "ideas": ["The Sun gives us light, heat, and ultraviolet (UV) rays — Mặt trời cung cấp ánh sáng, nhiệt và tia cực tím", "Many machines create radio waves — Nhiều máy móc tạo ra sóng vô tuyến", "Computers and radio stations generate radio waves — Máy tính và đài phát thanh tạo ra sóng vô tuyến", "Some home lights and lamps also make small electromagnetic waves — Một số đèn trong nhà cũng tạo ra sóng điện từ nhỏ"], "chains": ["The Sun gives us light, heat, and ultraviolet rays, but too much can burn our skin.", "Many machines create radio waves. Mobile phones, computers, and radio stations generate radio waves."]}, {"title": "Đoạn 2: Tác động có hại (Harmful Effects)", "ideas": ["Hurt the skin — Gây hại cho da", "Too much UV from the Sun can burn our skin — Quá nhiều tia UV có thể làm bỏng da", "Feel tired or get a headache — Cảm thấy mệt mỏi hoặc đau đầu", "Long exposure to radiation — Tiếp xúc với bức xạ trong thời gian dài"], "chains": ["Too much UV from the Sun can burn our skin. Our skin can become red and sore.", "Some people feel tired or get a headache when they are near many devices that make radio waves for a long time."]}]}, {"id": "food-delivery", "label": "Đề bổ sung 08 · Positive and negative effects of food delivery services", "type": "Positive & Negative Effects", "question": "Discuss the positive and negative effects of food delivery services.", "intro": "Bài luận thảo luận những tác động tích cực và tiêu cực của dịch vụ giao đồ ăn.", "groups": [{"title": "Đoạn 1: Ưu điểm (Positive Effects)", "ideas": ["Convenience — Sự tiện lợi", "Order food easily without going outside — Đặt đồ ăn dễ dàng mà không cần ra ngoài", "Save time significantly — Tiết kiệm đáng kể thời gian", "Help busy people — Giúp những người bận rộn", "Try different types of food — Thử nhiều loại đồ ăn khác nhau"], "chains": ["One of the main advantages is convenience. It empowers people to order food easily without going outside, allowing them to save time significantly.", "It is able to help busy people, old people, or students who do not need to cook, go to the market, and wash dishes."]}, {"title": "Đoạn 2: Nhược điểm (Negative Effects)", "ideas": ["More expensive than cooking at home — Đắt hơn nấu ăn ở nhà", "Pay for food, delivery fee and sometimes a tip — Trả tiền thức ăn, phí giao hàng và đôi khi cả tiền tip", "Unhealthy meals — Bữa ăn không lành mạnh", "Consume too much fat, sugar, or salt — Tiêu thụ quá nhiều chất béo, đường hoặc muối", "Make people lazy — Khiến mọi người lười biếng", "Spend less time with family — Dành ít thời gian hơn cho gia đình"], "chains": ["Ordering food is often more expensive than cooking at home. You have to pay for the food, the delivery fee, and sometimes a tip.", "Many delivered meals are unhealthy, with too much fat, sugar, or salt. If you order too often, it may affect your health."]}]}, {"id": "water-shortage-causes", "label": "Đề bổ sung 09 · Causes and solutions of water shortage", "type": "Causes & Solutions", "question": "Discuss reasons (causes) and solutions of the shortage/lack of clean water.", "intro": "Bài luận thảo luận nguyên nhân và giải pháp cho tình trạng thiếu nước sạch.", "groups": [{"title": "Đoạn 1: Nguyên nhân (Causes)", "ideas": ["Pollution of water sources — Ô nhiễm nguồn nước", "Industrial waste and agricultural runoff — Chất thải công nghiệp và dòng chảy nông nghiệp", "Population growth — Gia tăng dân số", "Lack of awareness — Thiếu nhận thức", "Pollute rivers and lakes — Gây ô nhiễm sông hồ"], "chains": ["One of the primary causes is the pollution of water sources. Industrial waste and agricultural runoff are often released directly into rivers and lakes, polluting water and making it unsafe for consumption.", "Another reason is that people waste too much water. For example, at home, many people do not turn off the tap while washing clothes."]}, {"title": "Đoạn 2: Giải pháp (Solutions)", "ideas": ["Use water wisely — Sử dụng nước một cách hợp lý", "Turn off the tap while washing clothes — Tắt vòi nước khi giặt quần áo", "Collect rainwater — Thu gom nước mưa", "Educate the public — Giáo dục cộng đồng", "Raise public awareness — Nâng cao nhận thức cộng đồng", "Government policies — Chính sách của chính phủ"], "chains": ["Individuals should use water wisely and turn off the tap when it is not needed.", "Governments can also play a key role by creating laws to protect water sources from pollution."]}]}, {"id": "save-fresh-water", "label": "Đề bổ sung 10 · How to save fresh water?", "type": "Discuss Solutions / Ways", "question": "How to save fresh water?", "intro": "Bài luận thảo luận những cách tiết kiệm nước ngọt trong sinh hoạt và sản xuất.", "groups": [{"title": "Đoạn 1: Hành động cá nhân và gia đình", "ideas": ["Turn off the tap while brushing teeth — Tắt vòi nước khi đánh răng", "Avoid unnecessary waste — Tránh lãng phí không cần thiết", "Collect rainwater for gardening and cleaning — Thu gom nước mưa để tưới cây và vệ sinh", "Use water-saving technology — Sử dụng công nghệ tiết kiệm nước"], "chains": ["Firstly, we can save water at home by using a more efficient/effectively way. Turning off the tap while brushing teeth or washing clothes is simple but effective ways to help minimize unnecessary waste.", "In addition, collecting rainwater for gardening and cleaning is another effective practice."]}, {"title": "Đoạn 2: Hành động của cộng đồng và chính phủ", "ideas": ["Eco-friendly industries — Các ngành công nghiệp thân thiện với môi trường", "Raise public awareness — Nâng cao nhận thức cộng đồng", "Public awareness-raising strategy — Chiến lược nâng cao nhận thức cộng đồng", "Importance of fresh water — Tầm quan trọng của nước ngọt", "Government role — Vai trò của chính phủ"], "chains": ["Secondly, industries and farmers should also apply/use water-saving technologies.", "Furthermore, a comprehensive public awareness-raising strategy highlighting the importance of saving water is very necessary.", "Similarly, the government can also play a key role by creating laws to protect water sources from pollution."]}]}, {"id": "children-mobile-phones", "label": "Đề bổ sung 11 · Children using mobile phones at an early age", "type": "Discuss Both Views & Opinion", "question": "Some people think that children should be allowed to use mobile phones at an early age, while others believe this may cause more harm than good. Discuss both views and give your opinion.", "intro": "Bài luận thảo luận hai quan điểm về việc trẻ em sử dụng điện thoại di động từ sớm và đưa ra ý kiến cá nhân.", "groups": [{"title": "Đoạn 1: Đồng ý cho trẻ sử dụng điện thoại", "ideas": ["Use mobile phones in the main curriculum — Sử dụng điện thoại trong chương trình học chính", "Access educational content — Tiếp cận nội dung giáo dục", "Watch educational videos — Xem video giáo dục", "Access the internet for research purposes — Truy cập Internet để nghiên cứu"], "chains": ["Using mobile phones in the main curriculum makes students focus on their studies. For instance, seeing a video on social media when using mobile phones can result in divided attention among students who access the Internet for research purposes."]}, {"title": "Đoạn 2: Những nhược điểm / quan điểm phản đối", "ideas": ["Connect with parents — Kết nối với cha mẹ", "Emotional support — Hỗ trợ tinh thần", "Improve language skills — Cải thiện kỹ năng ngôn ngữ", "Develop educational content — Phát triển nội dung giáo dục", "Distraction / divided attention — Sự xao nhãng / mất tập trung"], "chains": ["Children can stay connected with their parents and have emotional support when needed.", "In some cases, mobile phones provide the means of connection and help them feel less lonely. Mobile phones can also be used to improve language skills and widen their perspectives through educational content."]}]}, {"id": "keeping-diary", "label": "Đề bổ sung 12 · Benefits of keeping a daily diary", "type": "Discuss Benefits", "question": "Discuss the benefits of keeping a daily diary.", "intro": "Bài luận thảo luận những lợi ích của việc duy trì thói quen viết nhật ký hằng ngày.", "groups": [{"title": "Đoạn 1: Lợi ích về tinh thần và cảm xúc", "ideas": ["Fosters a sense of relief — Mang lại cảm giác nhẹ nhõm", "Allow individuals to express emotions — Cho phép cá nhân thể hiện cảm xúc", "Release stress — Giải tỏa căng thẳng", "Improve emotional well-being — Cải thiện sức khỏe tinh thần", "Self-reflection — Tự nhìn nhận bản thân"], "chains": ["A daily diary provides a sense of relief by allowing us to express our emotions.", "There is an ability to help us unwind and explore our emotions after a nerve-wracking time, especially when we feel stressed and need a private space to talk to ourselves."]}, {"title": "Đoạn 2: Lợi ích về trí nhớ, phát triển cá nhân và tổ chức công việc", "ideas": ["Capture memories — Ghi lại những kỷ niệm", "Discover new things about ourselves — Khám phá những điều mới về bản thân", "Improve writing ability — Cải thiện khả năng viết", "Boost creativity — Tăng cường sự sáng tạo", "Organize schedules — Sắp xếp lịch trình", "Manage daily activities — Quản lý hoạt động hằng ngày"], "chains": ["Keeping a diary is a wonderful treasure that helps us discover new things about ourselves.", "It improves our thinking ability because writing requires focus and creativity.", "A diary works like a personal history book and offers a meaningful way to document our lives, allowing us to revisit past experiences and memories.", "A diary is a great tool for planning and organizing life more effectively."]}]}, {"id": "fast-food-ban", "label": "Đề bổ sung 13 · Fast food should be banned", "type": "Agree or Disagree", "question": "Fast food is so harmful, it should be banned. Do you agree or disagree?", "intro": "Bài luận bàn về việc có nên cấm đồ ăn nhanh vì những tác hại của nó hay không.", "groups": [{"title": "Đoạn 1: Tiêu cực về sức khỏe (Health consequences)", "ideas": ["Contain toxic ingredients — Chứa các thành phần độc hại", "Lead to severe diseases — Dẫn đến các bệnh nghiêm trọng", "Consume excess sugar and fat — Tiêu thụ quá nhiều đường và chất béo", "Damage human bodies — Làm tổn hại cơ thể con người", "Cause childhood obesity — Gây béo phì ở trẻ em"], "chains": ["Fast food is often harmful because it contains toxic ingredients that lead to severe diseases.", "Consuming excess sugar and fat can damage human bodies.", "Cause childhood obesity."]}, {"title": "Đoạn 2: Tác động xã hội và lợi ích của việc cấm (Social impacts & Benefits of a ban)", "ideas": ["Target young generations — Nhắm mục tiêu vào thế hệ trẻ", "Form addictive eating habits — Hình thành thói quen ăn uống gây nghiện", "Create massive plastic waste — Tạo ra lượng rác thải nhựa khổng lồ", "Destroy the environment — Tàn phá môi trường", "Ban fast food products — Cấm các sản phẩm đồ ăn nhanh", "Protect public health — Bảo vệ sức khỏe cộng đồng"], "chains": ["Fast food brands target young generations through advertisements, forming addictive eating habits that are hard to break.", "The fast food industry creates massive plastic waste every day and destroys the environment.", "Governments should ban fast food products completely, which helps countries protect public health."]}]}, {"id": "computer-games", "label": "Đề bổ sung 14 · Effects of computer games on children's behavior", "type": "Effects & Solutions", "question": "Discuss the effects of computer games on children's behavior and how to minimize bad effects.", "intro": "Bài luận thảo luận ảnh hưởng của trò chơi máy tính đến hành vi trẻ em và cách giảm thiểu tác động tiêu cực.", "groups": [{"title": "Đoạn 1: Tác động của trò chơi máy tính", "ideas": ["Harmful effects of playing computer games — Tác động có hại của việc chơi trò chơi máy tính", "Influence children's behavior — Ảnh hưởng đến hành vi trẻ em", "Spend too much time gaming — Dành quá nhiều thời gian chơi game"], "chains": ["The source notes the harmful effects of playing computer games, but does not provide a detailed list of individual effects in this section."]}, {"title": "Đoạn 2: Giải pháp (Solutions)", "ideas": ["Comprehensive awareness-raising strategy — Chiến lược nâng cao nhận thức toàn diện", "Parents and teachers set rules and regulations — Cha mẹ và giáo viên đặt ra quy tắc và quy định", "Encourage hobby activities — Khuyến khích hoạt động sở thích", "Sports, reading, or drawing — Thể thao, đọc sách hoặc vẽ", "Limit gaming time — Giới hạn thời gian chơi game"], "chains": ["A comprehensive awareness-raising strategy can help children understand the harmful effects of playing computer games.", "Parents and teachers need to set rules and regulations for gaming.", "Parents should encourage their children to try new hobbies like sports, reading, or drawing."]}]}, {"id": "natural-ability-hard-work", "label": "Đề bổ sung 15 · Natural ability or hard work for success", "type": "Discuss Both Views & Opinion", "question": "Natural ability or hard work are more important in making athletes successful. Discuss both views and give your opinion.", "intro": "Bài luận thảo luận vai trò của năng khiếu tự nhiên và sự chăm chỉ trong thành công của vận động viên.", "groups": [{"title": "Đoạn 1: Vai trò của sự chăm chỉ (Hard work)", "ideas": ["Develop themselves — Phát triển bản thân", "Improve their skills — Cải thiện kỹ năng", "Learn new knowledge — Học kiến thức mới", "Develop abilities — Phát triển năng lực", "Improve confidence — Cải thiện sự tự tin", "Become more mature — Trở nên trưởng thành hơn"], "chains": ["Hard work is very necessary for athletes because it can give them many opportunities to develop themselves, improve their skills, and expand their knowledge.", "Hard work also helps athletes become more mature and motivated."]}, {"title": "Đoạn 2: Vai trò của năng khiếu tự nhiên (Natural ability)", "ideas": ["Feel more confident — Cảm thấy tự tin hơn", "Feel more comfortable mentally — Cảm thấy thoải mái hơn về tinh thần", "Play and train more comfortably — Chơi và luyện tập thoải mái hơn", "Help athletes enjoy sports — Giúp vận động viên yêu thích thể thao hơn"], "chains": ["Natural ability is also necessary and useful because it can help athletes feel more confident.", "Moreover, it can help them practice easily and simply, and make athletes enjoy their sport more."]}]}, {"id": "glass-office-buildings", "label": "Đề bổ sung 16 · Effects of modern glass office buildings", "type": "Advantages & Disadvantages / Effects", "question": "The use of modern glass office buildings is becoming more and more popular. Discuss the effects of modern glass office buildings.", "intro": "Bài luận thảo luận những tác động của việc sử dụng các tòa nhà văn phòng hiện đại bằng kính.", "groups": [{"title": "Đoạn 1: Tác động tích cực", "ideas": ["Beautiful and modern — Đẹp và hiện đại", "Attractive look — Vẻ ngoài hấp dẫn", "Reduce the need for artificial lighting — Giảm nhu cầu sử dụng ánh sáng nhân tạo", "Save energy — Tiết kiệm năng lượng", "Reduce greenhouse gas emissions — Giảm khí thải nhà kính", "Improve creativity and productivity — Cải thiện sự sáng tạo và năng suất"], "chains": ["Glass buildings are very beautiful and modern. They give cities an attractive look, making them more interesting.", "Glass allows natural light to enter, which reduces the need for artificial lighting. This helps save energy and reduce greenhouse gas emissions.", "People working in glass offices often feel more relaxed because they can see outside views, which reduces stress and improves productivity."]}, {"title": "Đoạn 2: Tác động tiêu cực", "ideas": ["Create a lot of heat during the summer — Tạo ra nhiều nhiệt vào mùa hè", "Increase the use of air conditioning — Tăng việc sử dụng điều hòa", "Financial burden — Gánh nặng tài chính", "Initial investment costs — Chi phí đầu tư ban đầu", "Lack of privacy — Thiếu sự riêng tư", "Feel watched and judged — Cảm thấy bị quan sát và đánh giá"], "chains": ["Glass buildings can create a lot of heat during the summer. This increases the use of air conditioning, which may harm the environment.", "They can create a financial burden because the initial investment costs are relatively high.", "Working in a glass office building can sometimes make people feel stressed because other people can see them all the time."]}]}, {"id": "advertising", "label": "Đề bổ sung 17 · Advantages and disadvantages of advertising", "type": "Advantages & Disadvantages", "question": "Discuss the advantages and disadvantages of advertising.", "intro": "Bài luận thảo luận những lợi ích và bất lợi của quảng cáo.", "groups": [{"title": "Đoạn 1: Ưu điểm (Advantages)", "ideas": ["Access to information — Tiếp cận thông tin", "Help people understand products, services, and trends — Giúp mọi người hiểu sản phẩm, dịch vụ và xu hướng", "Make better choices — Đưa ra lựa chọn tốt hơn", "Promote products — Quảng bá sản phẩm", "Attract customers — Thu hút khách hàng", "Increase sales — Tăng doanh số", "Understand cultural differences and global trends — Hiểu sự khác biệt văn hóa và xu hướng toàn cầu"], "chains": ["One of the important advantages of advertising is access to information. Advertising can help people understand new products, services, and trends.", "Advertising creates many opportunities for businesses. It helps companies promote their products, attract customers, and increase sales."]}, {"title": "Đoạn 2: Nhược điểm (Disadvantages)", "ideas": ["Unnecessary spending — Chi tiêu không cần thiết", "False information — Thông tin sai lệch", "Disappointed about the goods — Thất vọng về hàng hóa", "Increase the cost of products — Làm tăng giá thành sản phẩm", "Too many choices — Quá nhiều lựa chọn"], "chains": ["This can lead to unnecessary spending, causing financial burdens for some people.", "If the advertising information is not true, it will make the buyer disappointed about the goods.", "Some businesses have to spend a lot of money on advertising, thus increasing the cost of the products.", "Advertising can make buyers difficult to choose the most suitable item because there are too many choices."]}]}];

  <div id="outlineQuestion" class="question" style="margin-bottom:0"></div>
 </div>
 <div class="outline-card"><b style="color:var(--navy)">Lưu ý về dạng bài</b><div class="muted" style="margin-top:6px">Hãy điều chỉnh chức năng của Body 1 và Body 2 theo yêu cầu đề: lợi ích/bất lợi, nguyên nhân/giải pháp, hai quan điểm, tác động tích cực/tiêu cực hoặc luận điểm đồng ý/không đồng ý. Không phải đề nào cũng cần viết theo khung Advantages – Disadvantages.</div></div><div id="ideaBank"></div>
 <div class="outline-card">
  <h3 style="margin:0;color:var(--navy)">1. Introduction – Mở bài</h3>
  <label class="outline-label">Paraphrase the question</label><textarea id="olIntro" class="field" rows="3" placeholder="Nowadays, ..."></textarea>
  <label class="outline-label">Thesis statement / Main position</label><textarea id="olThesis" class="field" rows="2" placeholder="This essay will discuss... / In my opinion..."></textarea>
 </div>
 <div class="outline-card">
  <h3 style="margin:0;color:var(--navy)">2. Body Paragraph 1</h3>
  <div class="muted">Chọn các ý tưởng ở ngân hàng phía trên để đưa vào dàn ý, sau đó phát triển từng luận điểm.</div>
  <label class="outline-label">IDEA – Ý chính</label><textarea id="olB1" class="field" rows="3" placeholder="Firstly, ..."></textarea>
  <label class="outline-label">EXPLANATION – Giải thích</label><textarea id="olE1" class="field" rows="2" placeholder="This is because..."></textarea>
  <label class="outline-label">RESULT – Kết quả</label><textarea id="olR1" class="field" rows="2" placeholder="As a result, ..."></textarea>
  <label class="outline-label">EXAMPLE – Ví dụ</label><textarea id="olX1" class="field" rows="2" placeholder="For example, ..."></textarea>
 </div>
 <div class="outline-card">
  <h3 style="margin:0;color:var(--navy)">3. Body Paragraph 2</h3>
  <label class="outline-label">IDEA – Ý chính</label><textarea id="olB2" class="field" rows="3" placeholder="Secondly, ..."></textarea>
  <label class="outline-label">EXPLANATION – Giải thích</label><textarea id="olE2" class="field" rows="2" placeholder="This means that..."></textarea>
  <label class="outline-label">RESULT – Kết quả</label><textarea id="olR2" class="field" rows="2" placeholder="Consequently, ..."></textarea>
  <label class="outline-label">EXAMPLE – Ví dụ</label><textarea id="olX2" class="field" rows="2" placeholder="For instance, ..."></textarea>
 </div>
 <div class="outline-card">
  <h3 style="margin:0;color:var(--navy)">4. Conclusion – Kết bài</h3>
  <label class="outline-label">Restate the main ideas</label><textarea id="olConclusion" class="field" rows="2" placeholder="In conclusion, ..."></textarea>
  <label class="outline-label">Final opinion / Recommendation</label><textarea id="olOpinion" class="field" rows="2" placeholder="I believe that..."></textarea>
 </div>
 <div class="row">
  <button class="btn" onclick="previewOutline()">Xem dàn ý</button>
  <button class="btn light" onclick="saveOutline()">Lưu dàn ý</button>
  <button class="btn outline" onclick="copyOutline()">Sao chép</button>
 </div>
 <div id="outlinePreview" style="margin-top:14px"></div>
 <div class="outline-card"><b>Dàn ý đã lưu trên thiết bị này</b><div id="savedOutlines" class="saved-list" style="margin-top:10px"></div></div>`;
}
function loadOutline(i){
 selectedOutline=i;
 const q=OUTLINE_BANK[i];
 const question=document.getElementById('outlineQuestion');
 if(!question)return;
 question.innerHTML=`<div class="qtag">${q.label} · ${q.type||"Writing Task 2"}</div><div class="prompt" style="font-size:18px">${q.question}</div>${q.intro?`<div class="hint">${q.intro}</div>`:''}`;
 document.getElementById('ideaBank').innerHTML=q.groups.map((g,gi)=>`<div class="outline-card"><b style="color:var(--navy)">${g.title}</b><div class="idea-list">${g.ideas.map((idea,ii)=>`<button class="idea-chip" onclick="insertIdea(${gi},${ii})">${idea}</button>`).join('')}</div>${g.chains.length?`<div class="muted" style="margin-top:12px"><b>Ví dụ phát triển ý:</b>${g.chains.map(c=>`<p>${c}</p>`).join('')}</div>`:''}</div>`).join('');
 document.getElementById('olIntro').value=q.intro||'';
 ['olThesis','olB1','olE1','olR1','olX1','olB2','olE2','olR2','olX2','olConclusion','olOpinion'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('outlinePreview').innerHTML='';
}
function insertIdea(groupIndex,ideaIndex){
 const idea=OUTLINE_BANK[selectedOutline].groups[groupIndex].ideas[ideaIndex];
 const target=groupIndex===0?'olB1':'olB2';
 const el=document.getElementById(target);
 if(el){el.value+=(el.value.trim()?'\n':'')+idea;el.focus();}
}
function outlineText(){
 const q=OUTLINE_BANK[selectedOutline];
 const val=id=>document.getElementById(id)?.value.trim()||'';
 return `IELTS WRITING TASK 2 – OUTLINE\n${q.label}\n\nQUESTION: ${q.question}\n\nINTRODUCTION\nParaphrase: ${val('olIntro')}\nThesis: ${val('olThesis')}\n\nBODY PARAGRAPH 1\nIDEA: ${val('olB1')}\nEXPLANATION: ${val('olE1')}\nRESULT: ${val('olR1')}\nEXAMPLE: ${val('olX1')}\n\nBODY PARAGRAPH 2\nIDEA: ${val('olB2')}\nEXPLANATION: ${val('olE2')}\nRESULT: ${val('olR2')}\nEXAMPLE: ${val('olX2')}\n\nCONCLUSION\nRestatement: ${val('olConclusion')}\nOpinion: ${val('olOpinion')}`;
}
function previewOutline(){document.getElementById('outlinePreview').innerHTML=`<h3 style="color:var(--navy)">Bản xem trước</h3><div class="outline-preview"></div>`;document.querySelector('#outlinePreview .outline-preview').textContent=outlineText();}
function copyOutline(){const text=outlineText();if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>alert('Đã sao chép dàn ý!')).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('Đã sao chép dàn ý!');}
function saveOutline(){
 const saved=JSON.parse(localStorage.getItem('ielts_outline_saved')||'[]');
 const q=OUTLINE_BANK[selectedOutline];
 saved.unshift({name:q.label,date:new Date().toLocaleString('vi-VN'),text:outlineText()});
 localStorage.setItem('ielts_outline_saved',JSON.stringify(saved.slice(0,30)));
 renderSavedOutlines();alert('Đã lưu dàn ý trên thiết bị này.');
}
function renderSavedOutlines(){
 const el=document.getElementById('savedOutlines');if(!el)return;
 const saved=JSON.parse(localStorage.getItem('ielts_outline_saved')||'[]');
 el.innerHTML=saved.length?saved.map((x,i)=>`<button class="saved-pill" onclick="openSavedOutline(${i})">${x.name} · ${x.date}</button>`).join(''):'<span class="muted">Chưa có dàn ý nào được lưu.</span>';
}
function openSavedOutline(i){const x=JSON.parse(localStorage.getItem('ielts_outline_saved')||'[]')[i];if(x){document.getElementById('outlinePreview').innerHTML='<h3 style="color:var(--navy)">Dàn ý đã lưu</h3><div class="outline-preview"></div>';document.querySelector('#outlinePreview .outline-preview').textContent=x.text;}}

function render(){nav();let root=$('#app');if(page==='topics'){root.innerHTML=topicPage();$('#quiz').innerHTML=quizTopic()}if(page==='grammar'){root.innerHTML=grammarPage();$('#quiz').innerHTML=grammarQuiz()}if(page==='linkers'){root.innerHTML=linkerPage();$('#quiz').innerHTML=linkerQuiz()}if(page==='errors'){root.innerHTML=errorPage();$('#quiz').innerHTML=errorQuiz()}if(page==='outline'){root.innerHTML=outlinePage();loadOutline(selectedOutline);renderSavedOutlines()}}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;answered=false;if(page==='topics'){topicIndex=0;mode='envi';startPool(DATA.topics[0].items)}if(page==='grammar'){mode='formMeaning';grammarCat=-1;startGrammar()}if(page==='linkers'){mode='phraseMeaning';linkType='linkers';startLinkers()}if(page==='errors')errorIdx=0;if(page==='outline')selectedOutline=0;render()}));
startPool(DATA.topics[0].items);stats();render();
</script></body></html>
